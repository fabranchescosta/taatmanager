<script>
(function(){
  "use strict";
  var NATUREZA = { "Material":"variavel", "Combustível":"variavel", "Subcontratos":"variavel",

  var serie = null, colhendo = false;

  function colher(){
    var sel = document.querySelector(".fin2-an-sel select");
    if(!sel || sel.options.length < 2){ serie = []; return; }
    colhendo = true;
    var setV = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,"value").set;
    var orig = sel.value, dados = [], idx = sel.options.length - 1;
    function muda(v, cb){ setV.call(sel, v); sel.dispatchEvent(new Event("change",{bubbles:true}));
      var alvo = sel.options[sel.selectedIndex].text, t0 = Date.now();
      (function espera(){ var m = lerMes();
        if((m && m.mes === alvo) || Date.now() - t0 > 900) cb(); else setTimeout(espera, 60); })(); }
    (function passo(){
      if(idx < 0){ muda(orig, function(){ colhendo = false; serie = dados; aplicar(); }); return; }
      muda(sel.options[idx].value, function(){ var m = lerMes(); if(m) dados.push(m); idx--; passo(); });
    })();
  }
  function spark(vals){
    var v = vals.filter(function(x){ return x !== null && isFinite(x); });
    if(v.length < 2) return "";
    var mn = Math.min.apply(null,v), mx = Math.max.apply(null,v), amp = (mx - mn) || 1;
    var pts = v.map(function(x,i){
      return (i/(v.length-1)*100).toFixed(1) + "," + (20 - (x-mn)/amp*16 + 2).toFixed(1); }).join(" ");
    var fim = pts.split(" ").pop().split(",");
    return '<svg class="tt-spark" viewBox="0 0 100 24" preserveAspectRatio="none">' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--t3)" stroke-width="1.5"/>' +
      '<circle cx="' + fim[0] + '" cy="' + fim[1] + '" r="2" fill="var(--acc)"/></svg>';
  }
  function tile(rotulo, valor, sparkHtml, deltaHtml){
    return '<div class="tt-kpi"><span class="tt-kpi-l">' + rotulo + '</span>' +
      '<span class="tt-kpi-v">' + valor + '</span>' + (sparkHtml||"") +
      (deltaHtml ? '<span class="tt-kpi-d">' + deltaHtml + '</span>' : "") +
      '<span class="tt-kpi-s">vs. mês anterior</span></div>';
  }
  function deltaTxt(cur, prev, bomSubir, emPP){
    if(cur === null || prev === null || !isFinite(prev)) return "";
    var d = emPP ? (cur - prev) * 100 : (Math.abs(prev) > 0.004 ? (cur - prev)/Math.abs(prev)*100 : null);
    if(d === null || !isFinite(d)) return "";
    var sobe = d >= 0, bom = bomSubir ? sobe : !sobe;
    var s = (sobe ? "↗ +" : "↘ −") + Math.abs(d).toFixed(1).replace(".",",") + (emPP ? " p.p." : "%");
    return '<span class="' + (bom ? "c-grn" : "c-red") + '">' + s + '</span>';
  }
  function eur0(v){ return v === null ? "—" :
    Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ") + " €"; }

  function aplicar(){
    var fx = panelByTitle("Fixos e variáveis"), sc = panelByTitle("Saídas por categoria");
    var mapa = document.querySelector(".fin2-an-dr:not(.tt-mapa)");
    if(!fx || !sc || !mapa) return;

    document.querySelectorAll(".tt-custos,.tt-mapa,.tt-kpis").forEach(function(n){ n.remove(); });

    var F = legVal(fx,"Fixos"), V = legVal(fx,"Variáveis"), PC = legVal(fx,"Por classificar") || 0;

    /* ---- 1. Mapa de resultados por margem de contribuição ---- */
    var rTopo = mapa.querySelector(".fin2-an-dr-l.topo"),
        rRes  = mapa.querySelector(".fin2-an-dr-l.resultado"),
        rFora = mapa.querySelector(".fin2-an-dr-l.fora");
    var receita = rTopo && num(rTopo.querySelector(".fin2-an-dr-v").textContent);
    var resultado = rRes && num(rRes.querySelector(".fin2-an-dr-v").textContent);
    var fecha = receita !== null && resultado !== null && F !== null && V !== null &&
                Math.abs((receita - V - F - PC) - resultado) < 0.02;
    if(fecha){
      var novo = el("div","fin2-an-dr tt-mapa");
      novo.appendChild(rTopo.cloneNode(true));
      function linha(cls, nome, nota, valTxt, valCls){
        var r = el("div","fin2-an-dr-l " + (cls||""));
        r.appendChild(el("span","fin2-an-dr-n",nome));
        r.appendChild(el("span","fin2-an-dr-nota",nota));
        r.appendChild(el("span","fin2-an-dr-v " + (valCls||""),valTxt));
        return r; }
      novo.appendChild(linha("", "Custos variáveis",
        "material, freelancers e deslocações — só saem quando há trabalho", fmt(-V).replace("+","")));
      var marg = receita - V;
      novo.appendChild(linha("tt-margem", "Margem de contribuição",
        receita > 0 ? Math.round(marg/receita*100) + "% da receita do mês" : "", fmt(marg), marg >= 0 ? "c-blu" : ""));
      novo.appendChild(linha("", "Custos fixos",
        "salários da equipa, rendas e recorrências — saem haja ou não obra", fmt(-F).replace("+","")));
      if(PC > 0.004) novo.appendChild(linha("", "Por classificar",
        "custos ainda sem lado atribuído", fmt(-PC).replace("+","")));
      novo.appendChild(rRes.cloneNode(true));
      if(rFora) novo.appendChild(rFora.cloneNode(true));
      mapa.classList.add("tt-oculto");
      mapa.parentNode.insertBefore(novo, mapa);
    } else {
      mapa.classList.remove("tt-oculto");
    }

    /* ---- 2. Custos: resumo fixos/variáveis + lista única por tipo de custo ---- */
    var painel = el("section","fin2-card fin2-an-painel tt-custos");
    var cab = el("div","fin2-an-cab");
    var h3 = el("h3","", "Custos ");
    var mes = fx.querySelector("h3 span"); if(mes) h3.appendChild(mes.cloneNode(true));
    cab.appendChild(h3);
    var atalho = fx.querySelector(".fin2-an-atalho"); if(atalho) cab.appendChild(atalho.cloneNode(true));
    painel.appendChild(cab);

    var lista = el("div","tt-lista");
    sc.querySelectorAll(".fin2-an-row").forEach(function(row){
      var r = row.cloneNode(true);
      var nome = r.querySelector(".fin2-an-nome");
      var nat = (nome && NATUREZA[nome.textContent.trim()]) || "validar";
      var barra = r.querySelector(".fin2-an-bar i"); if(barra) barra.style.background = COR[nat];
      if(nat === "validar"){ var lb = r.querySelector(".fin2-an-lb");
        if(lb) lb.appendChild(el("span","tt-chip","a validar")); }
      lista.appendChild(r); });
    painel.appendChild(lista);

    var grafico = el("div","tt-grafico");
    var subp = fx.querySelector(".fin2-an-sub-p");
    if(subp){ var sp2 = subp.cloneNode(true);
      sp2.innerHTML = sp2.innerHTML.replace(/ponto morto/g, "break even");
      grafico.appendChild(sp2); }
    var pilha = fx.querySelector(".fin2-an-pilha");
    if(pilha){ var pc2 = pilha.cloneNode(true); var segs = pc2.querySelectorAll("i");
      if(segs[0]) segs[0].style.background = COR.fixo;
      if(segs[1]) segs[1].style.background = COR.variavel;
      grafico.appendChild(pc2); }
    var legenda = el("div","fin2-an-legenda");
    var legF = legByName(fx,"Fixos"), legV = legByName(fx,"Variáveis"), legPC = legByName(fx,"Por classificar");
    if(legF) legenda.appendChild(pinta(legF.cloneNode(true), COR.fixo));
    if(legV) legenda.appendChild(pinta(legV.cloneNode(true), COR.variavel));
    if(legPC) legenda.appendChild(pinta(legPC.cloneNode(true), COR.validar));
    grafico.appendChild(legenda);
    painel.appendChild(grafico);

    var morto = fx.querySelector(".fin2-an-morto");
    if(morto){
      var m2 = morto.cloneNode(true);
      var lbl = m2.querySelector(".stat-lbl"); if(lbl) lbl.textContent = "Break even";
      if(fecha && receita > 0 && (receita - V) > 0){
        var mPct = (receita - V) / receita, be = F / mPct, cob = Math.round(receita / be * 100);
        var v2 = m2.querySelector(".fin2-an-morto-v");
        var antigo = v2 ? v2.textContent.trim() : "";
        if(v2) v2.innerHTML = fmt(be).replace("+","") + "<small> /m\u00eas</small>";
        var p2 = m2.querySelector(".fin2-an-morto-p");
        if(p2) p2.innerHTML = "\u00c9 a fatura\u00e7\u00e3o mensal a partir da qual deixas de perder dinheiro, com os n\u00fameros deste m\u00eas: <b class=\"mono\">" + fmt(F).replace("+","") +
          "</b> de custos fixos a dividir pela margem de contribui\u00e7\u00e3o de <b class=\"mono\">" + Math.round(mPct*100) + "%</b>. A receita do m\u00eas cobre <b class=\"mono\">" + cob +
          "%</b> do break even." + (antigo ? " O motor antigo dava <b class=\"mono\">" + antigo + "</b> pela m\u00e9dia de 6 meses \u2014 c\u00e1lculo por validar." : "");
      }
      painel.appendChild(m2);
    }
    var footS = sc.querySelector(".fin2-an-sub-p");
    painel.appendChild(el("div","fin2-an-foot",
      "Na lista, barra <b>azul</b> = custo fixo, <b>verde</b> = variável, cinza = natureza por confirmar (mapeamento provisório, fecha-se na validação dos números). As linhas mostram só o que tem documento" +
      (footS ? " — " + footS.textContent.trim().charAt(0).toLowerCase() + footS.textContent.trim().slice(1) : ".")));
    var footF = fx.querySelector(".fin2-an-foot"); if(footF) painel.appendChild(footF.cloneNode(true));

    fx.classList.add("tt-oculto"); sc.classList.add("tt-oculto");
    var precos = panelByTitle("Pre\u00e7os de compra"); if(precos) precos.classList.add("tt-oculto");
    fx.parentNode.insertBefore(painel, fx);

    /* ---- 3. Fila de KPIs (tiles com histórico dos meses do seletor) ---- */
    if(serie && serie.length > 1){
      var mesAtu = fx.querySelector("h3 span");
      mesAtu = mesAtu ? mesAtu.textContent.replace("·","").trim() : "";
      var iM = -1;
      for(var k = 0; k < serie.length; k++) if(serie[k].mes === mesAtu) iM = k;
      if(iM >= 0){
        var cur = serie[iM], ant = iM > 0 ? serie[iM-1] : null;
        var col = function(campo){ return serie.map(function(m){ return m[campo]; }); };
        var html = "";
        html += tile("Receita", eur0(cur.receita), spark(col("receita")),
          ant ? deltaTxt(cur.receita, ant.receita, true) : "");
        html += tile("Custos", eur0(cur.custos), spark(col("custos")),
          ant ? deltaTxt(cur.custos, ant.custos, false) : "");
        html += tile("Resultado", (cur.resultado !== null && cur.resultado >= 0 ? "+" : "") + eur0(cur.resultado),
          spark(col("resultado")), ant ? deltaTxt(cur.resultado, ant.resultado, true) : "");
        html += tile("Margem contrib.", cur.mPct !== null ? Math.round(cur.mPct*100) + "%" : "—",
          spark(col("mPct")), ant ? deltaTxt(cur.mPct, ant.mPct, true, true) : "");
        if(cur.cob !== null){
          var pctD = Math.min(cur.cob, 100), Circ = 2 * Math.PI * 17;
          var corD = cur.cob >= 100 ? "var(--grn)" : (cur.cob >= 70 ? "var(--ylw)" : "var(--red)");
          html += '<div class="tt-kpi tt-kpi--donut"><span class="tt-kpi-l">Break even</span>' +
            '<svg width="46" height="46" viewBox="0 0 46 46">' +
            '<circle cx="23" cy="23" r="17" fill="none" stroke="var(--s3)" stroke-width="5"/>' +
            '<circle cx="23" cy="23" r="17" fill="none" stroke="' + corD + '" stroke-width="5" ' +
            'stroke-linecap="round" stroke-dasharray="' + (pctD/100*Circ).toFixed(1) + ' ' + Circ.toFixed(1) + '" ' +
            'transform="rotate(-90 23 23)"/>' +
            '<text x="23" y="27" text-anchor="middle" font-size="11" fill="var(--t1)">' +
            Math.round(cur.cob) + "%</text></svg>" +
            '<span class="tt-kpi-s">da faturação necessária</span></div>';
        }
        var kpis = el("div","tt-kpis"); kpis.innerHTML = html;
        var painelMapa = mapa.closest(".fin2-an-painel");
        if(painelMapa) painelMapa.parentNode.insertBefore(kpis, painelMapa);
      }
    }
  }

  var agendado = 0;
  function agendar(){ if(agendado || colhendo) return; agendado = setTimeout(function(){ agendado = 0; aplicar(); }, 150); }
  var tent = 0, boot = setInterval(function(){
    if(document.querySelector(".fin2-an-dr") || ++tent > 40){ clearInterval(boot); aplicar(); setTimeout(colher, 300);
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){ var t = ms[i].target;
          var e = t.nodeType === 3 ? t.parentElement : t;
          if(e && e.closest && e.closest(".tt-custos,.tt-mapa")) continue;
          if(e && e.closest && !e.closest(".fin2-an-colunas")) continue;
          agendar(); return; }
      }).observe(document.body, { childList:true, subtree:true, characterData:true });
    }
  }, 250);
})();
</script>

<style>
  /* Fecho de layout — margens de página e largura máxima (29/08/2026) */
  .fin2-an{padding:28px 32px 72px;max-width:1560px;margin:0 auto}
  @media(max-width:1180px){.fin2-an{padding:20px 20px 56px}}
  @media(max-width:640px){.fin2-an{padding:14px 12px 48px}}
  /* linhas de escalões/categorias: não deixar os valores tocar na borda do painel */
  .fin2-an-row{grid-template-columns:minmax(118px,1.4fr) minmax(40px,1.8fr) auto auto;gap:var(--sp-2)}
  /* Resultado do mês em ecrã estreito: nome + valor na 1.ª linha, nota por baixo */
  @container (max-width:520px){
    .fin2-an-dr-l{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
    .fin2-an-dr-nota{grid-column:1/-1;grid-row:2}
    .fin2-an-dr-nota:empty{display:none}
    .fin2-an-dr-v{min-width:0}
  }
</style>
